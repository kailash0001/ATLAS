apiVersion: v1
kind: Namespace
metadata:
  name: aegis
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
  namespace: aegis
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: version-runtimes
  namespace: aegis
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller
  namespace: aegis
subjects:
  - kind: ServiceAccount
    name: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: version-runtimes
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
  namespace: aegis
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow
  namespace: aegis
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: aegis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17.6-bookworm
          env:
            - {name: POSTGRES_USER, value: aegis}
            - {name: POSTGRES_PASSWORD, value: aegis_local}
            - {name: POSTGRES_DB, value: aegis}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, aegis]}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts: [{name: db, mountPath: /var/lib/postgresql/data}]
      volumes:
        - name: db
          persistentVolumeClaim: {claimName: postgres}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: aegis}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mlflow, namespace: aegis}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mlflow}
  template:
    metadata:
      labels: {app: mlflow}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mlflow
          image: aegis-platform:local
          imagePullPolicy: IfNotPresent
          command: [mlflow, server, --host, 0.0.0.0, --port, "5000", --backend-store-uri, "sqlite:////mlflow/metadata.db", --serve-artifacts, --artifacts-destination, /mlflow/artifacts, --allowed-hosts, "mlflow,mlflow:5000,localhost:5000,127.0.0.1:5000"]
          ports: [{containerPort: 5000}]
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts: [{name: artifacts, mountPath: /mlflow}]
      securityContext: {runAsUser: 10002, runAsNonRoot: true, fsGroup: 10002}
      volumes:
        - name: artifacts
          persistentVolumeClaim: {claimName: mlflow}
---
apiVersion: v1
kind: Service
metadata: {name: mlflow, namespace: aegis}
spec:
  selector: {app: mlflow}
  ports: [{port: 5000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: control-api, namespace: aegis}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: control-api}
  template:
    metadata:
      labels: {app: control-api}
    spec:
      serviceAccountName: controller
      initContainers:
        - name: data-permissions
          image: busybox:1.37.0
          command: [sh, -c, "chown 10002:10002 /app/data"]
          volumeMounts: [{name: data, mountPath: /app/data}]
        - name: migrate
          image: aegis-platform:local
          imagePullPolicy: IfNotPresent
          command: [aegis, db, upgrade]
          envFrom: [{secretRef: {name: aegis-platform}}]
      containers:
        - name: control-api
          image: aegis-platform:local
          imagePullPolicy: IfNotPresent
          envFrom: [{secretRef: {name: aegis-platform}}]
          env: [{name: AEGIS_DEPLOYMENT_BACKEND, value: kubernetes}]
          ports: [{containerPort: 8100}]
          readinessProbe:
            httpGet: {path: /health/ready, port: 8100}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: 8100}
            initialDelaySeconds: 30
          securityContext: {runAsUser: 10002, runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 200m, memory: 768Mi}
            limits: {cpu: "2", memory: 3Gi}
          volumeMounts: [{name: data, mountPath: /app/data}]
      volumes:
        - name: data
          hostPath: {path: /aegis-data, type: DirectoryOrCreate}
---
apiVersion: v1
kind: Service
metadata: {name: control-api, namespace: aegis}
spec:
  type: NodePort
  selector: {app: control-api}
  ports: [{port: 8100, targetPort: 8100, nodePort: 30100}]
