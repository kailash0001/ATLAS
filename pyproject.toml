[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisml"
version = "0.1.0"
description = "Local-first ML reliability and operations platform"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mlflow==3.16.1", "scikit-learn==1.7.2", "pandas==2.3.3", "numpy==2.3.3",
  "sqlalchemy==2.0.43", "psycopg[binary]==3.2.10", "alembic==1.16.5",
  "pydantic-settings==2.10.1", "PyYAML==6.0.2", "typer==0.19.2", "psutil==7.1.0",
  "fastapi==0.141.1", "uvicorn==0.53.0", "prometheus-client==0.26.0", "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==6.3.0", "ruff==0.13.2"]
reliability = ["evidently==0.7.23"]

[project.scripts]
atlas = "aegis.cli.main:main"
aegis = "aegis.cli.main:main"

[tool.setuptools.packages.find]
include = ["aegis*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real MLflow and SQL database lifecycle", "remediation: full retraining lifecycle"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
